<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    <title>LenaBeauty — نظام تشغيل مركز التجميل</title>
    <meta
      name="description"
      content="LenaBeauty — نظام التشغيل اليومي لمركز تجميل واحد: المواعيد ونقطة البيع والعملاء والمخزون والموظفون في مكان واحد. للاستخدام من فريق المركز."
    />
    <!-- PWA & Mobile Web Capabilities -->
    <!-- Manifest is injected automatically by vite-plugin-pwa (/manifest.webmanifest) -->
    <!-- Theme colors must match the Lena brand tokens in src/index.css
         (violet primary on plum surfaces) and the PWA manifest. -->
    <meta name="theme-color" content="#8B5CF6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17131F" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lena Beauty" />
    <link rel="icon" href="/lena-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <!-- The PWA plugin injects the single manifest link during build. -->
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Mobile loading screen with safe-area support -->
    <!-- First paint uses the real brand mark and the Lena plum/violet tokens.
         The previous navy gradient and emoji placeholder made the product look
         like an unfinished template before React had even booted. -->
    <div id="root">
      <div style="height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#241C33 0%,#17131F 100%);color:#EDE9FE;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
        <div style="text-align:center">
          <img src="/lena-mark.svg" alt="" width="64" height="64" style="display:block;margin:0 auto 0.75rem" />
          <div style="font-size:1rem;font-weight:600;letter-spacing:0.01em">LenaBeauty</div>
          <div style="font-size:0.75rem;margin-top:0.375rem;opacity:0.72">نظام تشغيل مركز التجميل</div>
          <div style="font-size:0.6875rem;margin-top:0.75rem;opacity:0.5">جاري التحميل…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
