<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    <title>Lena Beauty — نظام إدارة مركز التجميل</title>
    <meta
      name="description"
      content="Lena Beauty — المواعيد ونقطة البيع والعملاء والمخزون والموظفون والتقارير في تجربة واحدة مصممة لمراكز التجميل."
    />
    <!-- PWA & Mobile Web Capabilities -->
    <!-- Manifest is injected automatically by vite-plugin-pwa (/manifest.webmanifest) -->
    <!-- Theme colors stay aligned with the Lena violet product accent; the
         rose-gold signature is decorative and intentionally not a status color. -->
    <meta name="theme-color" content="#8B5CF6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17131F" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lena Beauty" />
    <link rel="icon" href="/lena-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/lena-mark.svg" />
    <!-- The PWA plugin injects the single manifest link during build. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Premium first paint: same pale lavender / blush / rose-gold language
         as the authenticated login, before React finishes booting. -->
    <div id="root">
      <div style="height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 0%,rgba(211,161,93,.18),transparent 24rem),radial-gradient(circle at 90% 90%,rgba(175,137,210,.25),transparent 28rem),linear-gradient(135deg,#fffdfb 0%,#fcf6fb 48%,#f4ecfa 100%);color:#241a33;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)">
        <div style="text-align:center;filter:drop-shadow(0 18px 32px rgba(83,52,100,.12))">
          <img src="/lena-mark.svg" alt="" width="112" height="112" style="display:block;margin:0 auto .2rem" />
          <div style="font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;font-weight:600;letter-spacing:.18em">LENA</div>
          <div style="font-size:.625rem;margin-top:.2rem;font-weight:700;letter-spacing:.32em;color:#b77a3f">BEAUTY</div>
          <div style="width:72px;height:1px;margin:.8rem auto;background:linear-gradient(90deg,transparent,#c99455,transparent)"></div>
          <div style="font-size:.6875rem;opacity:.58">جاري التحميل…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
