name: One-shot canonical gate diagnostic

on:
  push:
    branches:
      - ops/audit-artifacts-refresh-20260901

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture canonical audit gate output
        shell: bash
        run: |
          set +e
          npm run audit:gate > /tmp/canonical-gate.log 2>&1
          gate_status=$?
          set -e
          {
            echo "canonical_gate_status=${gate_status}"
            echo
            echo "--- artifact status ---"
            git status --short docs/database-contract/artifacts || true
            echo
            echo "--- canonical gate output ---"
            tail -n 300 /tmp/canonical-gate.log
          } > canonical-gate-diagnostic.txt
          cat canonical-gate-diagnostic.txt

      - name: Commit temporary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical-gate-diagnostic.txt
          git commit -m "ops: capture canonical gate diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
