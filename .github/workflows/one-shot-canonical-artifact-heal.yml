name: One-shot canonical artifact self-heal

on:
  push:
    branches:
      - ops/audit-artifacts-refresh-20260901

permissions:
  contents: write

jobs:
  heal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical audit gate and regenerate artifacts
        shell: bash
        run: |
          set +e
          npm run audit:gate
          gate_status=$?
          set -e
          echo "canonical_gate_status=${gate_status}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --short docs/database-contract/artifacts >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit canonical generated artifact deltas
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/database-contract/artifacts; then
            echo "No generated artifact delta remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/database-contract/artifacts/*.json
          git commit -m "chore: align audit artifacts with canonical gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
