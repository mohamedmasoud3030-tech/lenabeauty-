name: Apply Demo Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# A migration must never run concurrently with another migration deployment.
# `cancel-in-progress: false` preserves ordered, append-only application.
concurrency:
  group: lena-demo-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-apply:
    name: Validate and apply pending migrations to Demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Do not apply a database change from a revision whose application contract
      # has not passed its own checks.
      - name: Validate application and migration contracts
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Verify deployment credentials are configured
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the Demo Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # `db push` reads Supabase's migration history and applies only pending,
      # lexically ordered files. It never runs demo seeds.
      - name: Apply pending migrations
        run: supabase db push --linked
