name: Apply Demo Supabase migrations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lena-demo-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static-validation:
    name: Static application and database gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_DATA_BACKEND: supabase
      VITE_BRANCH_MODE: single

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical contracts
        run: |
          npm run audit:gate
          npm run db:types:check
          npm run ci:migrations
          npm run ci:rpc-check
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm audit --audit-level=low
          git diff --check

  credential-probe:
    name: Detect live Demo deployment credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        name: Check secret availability without exposing values
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DEMO_SUPABASE_PROJECT_REF: ${{ secrets.DEMO_SUPABASE_PROJECT_REF }}
          DEMO_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          DEMO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEMO_SUPABASE_PUBLISHABLE_KEY }}
          DEMO_CENTER_ID: ${{ secrets.DEMO_CENTER_ID }}
          DEMO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] \
            && [ -n "$SUPABASE_PROJECT_REF" ] \
            && [ -n "$SUPABASE_DB_PASSWORD" ] \
            && [ -n "$DEMO_SUPABASE_PROJECT_REF" ] \
            && [ -n "$DEMO_SUPABASE_URL" ] \
            && [ -n "$DEMO_SUPABASE_PUBLISHABLE_KEY" ] \
            && [ -n "$DEMO_CENTER_ID" ] \
            && [ -n "$DEMO_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All credentialed Demo deployment inputs are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live Demo deployment is safely skipped because one or more required GitHub Actions secrets are not configured. Static gates still run; no live deployment is claimed."
          fi

  live-demo-deployment:
    name: Live Demo migration and security gates
    needs: [static-validation, credential-probe]
    # Remote schema changes are approval-gated: PRs and ordinary main pushes run
    # static validation only. An operator must explicitly dispatch this workflow.
    if: needs.credential-probe.outputs.available == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DEMO_SUPABASE_PROJECT_REF: ${{ secrets.DEMO_SUPABASE_PROJECT_REF }}
      VITE_DATA_BACKEND: supabase
      VITE_BRANCH_MODE: single
      VITE_ENVIRONMENT: staging
      VITE_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEMO_SUPABASE_PUBLISHABLE_KEY }}
      VITE_CENTER_ID: ${{ secrets.DEMO_CENTER_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify explicit Lena Demo target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_REF" != "$DEMO_SUPABASE_PROJECT_REF" ]; then
            echo "Refusing migration: configured target does not equal the explicit Demo project ref." >&2
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "tuzzvqsnbtzvkffmazyf" ]; then
            echo "Refusing migration: target is not the canonical Lena Demo/Staging project." >&2
            exit 1
          fi

      - name: Enforce hosted Demo password-change reauthentication
        shell: bash
        run: |
          set -euo pipefail
          auth_config_url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          curl --fail-with-body --silent --show-error \
            -X PATCH "$auth_config_url" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"security_update_password_require_reauthentication":true}' \
            >/tmp/lena-auth-config-patch.json
          curl --fail-with-body --silent --show-error \
            "$auth_config_url" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            >/tmp/lena-auth-config.json
          jq -e '.security_update_password_require_reauthentication == true' \
            /tmp/lena-auth-config.json >/dev/null
          if jq -e '.password_hibp_enabled == true' /tmp/lena-auth-config.json >/dev/null; then
            echo "PASS hosted Demo leaked-password protection is enabled."
          else
            echo "::notice::Hosted leaked-password protection is not enabled. Lena Demo is currently on Supabase Free, where this Pro-plan feature is unavailable; require it before a paid Production launch."
          fi
          echo "PASS hosted Demo password-change reauthentication is enabled."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link explicit Demo Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show remote migration state before apply
        run: supabase migration list --linked

      - name: Install PostgreSQL client for preflight and acceptance
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Read-only attendance and Storage preflight
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          connection="host=db.${SUPABASE_PROJECT_REF}.supabase.co port=5432 dbname=postgres user=postgres sslmode=require"

          if [ "$(psql "$connection" -X -A -t -v ON_ERROR_STOP=1 -c "select to_regclass('public.attendance_records') is not null")" != "t" ]; then
            echo "Refusing migration: attendance_records is missing from the Demo schema." >&2
            exit 1
          fi

          duplicate_keys="$(psql "$connection" -X -A -t -v ON_ERROR_STOP=1 -c "
            select count(*) from (
              select center_id, employee_id, date
              from public.attendance_records
              group by center_id, employee_id, date
              having count(*) > 1
            ) duplicate_days
          ")"
          invalid_attendance="$(psql "$connection" -X -A -t -v ON_ERROR_STOP=1 -c "
            select count(*)
            from public.attendance_records
            where (check_in_time is not null and check_out_time is not null and check_out_time <= check_in_time)
               or work_hours < 0
          ")"
          bucket_metadata="$(psql "$connection" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "
            select coalesce(file_size_limit::text, 'NULL'),
                   coalesce(array_to_string(allowed_mime_types, ','), 'NULL')
            from storage.buckets
            where id = 'center-assets'
          ")"

          echo "Attendance duplicate day keys: ${duplicate_keys}"
          echo "Attendance invalid time/hour rows: ${invalid_attendance}"
          if [ -z "$bucket_metadata" ]; then
            echo "Refusing migration: center-assets bucket is missing." >&2
            exit 1
          fi
          echo "center-assets before migration (file_size_limit|allowed_mime_types): ${bucket_metadata}"
          {
            echo "### Demo pre-migration snapshot"
            echo "- Attendance duplicate day keys: ${duplicate_keys}"
            echo "- Attendance invalid time/hour rows: ${invalid_attendance}"
            echo "- center-assets before migration: ${bucket_metadata}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$duplicate_keys" != "0" ] || [ "$invalid_attendance" != "0" ]; then
            echo "Refusing migration: attendance integrity violations require owner-reviewed correction; no row was changed." >&2
            exit 1
          fi

      - name: Mark manual admin bootstrap as handled out-of-band
        shell: bash
        run: |
          set -euo pipefail
          history="$(supabase migration list --linked)"
          if printf '%s\n' "$history" | awk -F '│' '
            NF >= 2 {
              local_version=$1
              remote_version=$2
              gsub(/[[:space:]]/, "", local_version)
              gsub(/[[:space:]]/, "", remote_version)
              if (local_version == "20260628000002" && remote_version == "20260628000002") found=1
            }
            END { exit(found ? 0 : 1) }
          '; then
            echo "Manual admin bootstrap is already recorded in remote migration history."
          else
            echo "Recording manual admin bootstrap as applied without executing its placeholder SQL."
            supabase migration repair 20260628000002 --status applied
          fi

      - name: Apply pending canonical migrations
        run: supabase db push --linked --yes

      - name: Verify remote migration history is fully aligned
        shell: bash
        run: |
          set -euo pipefail
          history="$(supabase migration list --linked)"
          printf '%s\n' "$history"
          drift="$(printf '%s\n' "$history" | awk -F '│' '
            NF >= 2 {
              local_version=$1
              remote_version=$2
              gsub(/[[:space:]]/, "", local_version)
              gsub(/[[:space:]]/, "", remote_version)
              local_is_version=(local_version ~ /^[0-9]+$/ && length(local_version) == 14)
              remote_is_version=(remote_version ~ /^[0-9]+$/ && length(remote_version) == 14)
              if ((local_is_version || remote_is_version) && local_version != remote_version) {
                print local_version " != " remote_version
              }
            }
          ')"
          if [ -n "$drift" ]; then
            echo "Migration history drift remains after db push:" >&2
            printf '%s\n' "$drift" >&2
            exit 1
          fi
          echo "PASS local and remote migration histories are aligned."

      - name: Verify live Demo schema and center contract
        run: npm run preflight:supabase

      - name: Run rollback-safe SQL acceptance tests
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          connection="host=db.${SUPABASE_PROJECT_REF}.supabase.co port=5432 dbname=postgres user=postgres sslmode=require"
          for test_file in supabase/tests/*.sql; do
            echo "Running rollback-safe acceptance: ${test_file}"
            psql "$connection" -X -v ON_ERROR_STOP=1 --file "$test_file"
          done
