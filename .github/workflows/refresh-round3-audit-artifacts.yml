name: Refresh Round 3 audit artifacts

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  refresh:
    if: github.head_ref == 'ops/round3-closeout'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ops/round3-closeout

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run audit:all

      - name: Commit regenerated audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add docs/database-contract/artifacts
          if git diff --cached --quiet; then
            echo "Audit artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(audit): refresh database contract artifacts"
          git push origin HEAD:ops/round3-closeout
