name: Reconcile generated audit artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical audit artifacts
        run: |
          node scripts/audit/replay-schema.mjs
          node scripts/audit/scan-frontend.mjs
          node scripts/audit/build-matrix.mjs

      - name: Commit exact generated artifacts when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/database-contract/artifacts; then
            echo "Audit artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/database-contract/artifacts
          git commit -m "refresh database contract audit artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
