name: One-shot full static production gate

on:
  push:
    branches:
      - ops/audit-artifacts-refresh-20260901

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_DATA_BACKEND: supabase
      VITE_BRANCH_MODE: single
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run authoritative static gate commands
        run: |
          npm run audit:gate
          npm run db:types:check
          npm run ci:migrations
          npm run ci:rpc-check
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm audit --audit-level=low
          git diff --check
