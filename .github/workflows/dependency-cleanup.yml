name: Dependency cleanup

on:
  push:
    branches:
      - cleanup/deep-clean-round-1
    paths:
      - .github/workflows/dependency-cleanup.yml

permissions:
  contents: write

env:
  VITE_DATA_BACKEND: supabase
  VITE_BRANCH_MODE: single

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/deep-clean-round-1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Remove redundant package entries
        run: |
          npm pkg delete dependencies.vite
          npm pkg delete devDependencies.autoprefixer
          npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Validate full repository gates
        run: |
          npm run audit:gate
          npm run db:types:check
          npm run ci:migrations
          npm run ci:rpc-check
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm audit --audit-level=low
          git diff --check
      - name: Commit validated dependency cleanup
        run: |
          rm .github/workflows/dependency-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cleanup): remove redundant build dependencies"
          git push origin HEAD:cleanup/deep-clean-round-1
