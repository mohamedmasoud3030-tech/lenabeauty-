name: Runtime reachability audit

on:
  push:
    branches:
      - cleanup/deep-clean-round-1
    paths:
      - .github/workflows/reachability-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/deep-clean-round-1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build runtime import graph
        run: node scripts/reachability-audit.mjs
