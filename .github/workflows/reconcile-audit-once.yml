name: Reconcile audit artifacts once

on:
  push:
    branches:
      - ui/lena-beauty-brand-rollout-20260901
    paths:
      - .github/workflows/reconcile-audit-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate canonical audit artifacts
        run: npm run audit:all
      - name: Commit generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git add docs/database-contract/artifacts/*.json
          if git diff --cached --quiet; then
            echo "Audit artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: reconcile generated audit artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
