name: Cleanup sync audit artifacts

on:
  push:
    branches:
      - cleanup/deep-clean-round-1
    paths:
      - .github/workflows/cleanup-sync-audit.yml

permissions:
  contents: write

env:
  VITE_DATA_BACKEND: supabase
  VITE_BRANCH_MODE: single

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/deep-clean-round-1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate database audit artifacts
        run: |
          node scripts/audit/replay-schema.mjs
          node scripts/audit/scan-frontend.mjs
          node scripts/audit/build-matrix.mjs

      - name: Commit fresh artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/database-contract/artifacts
          if git diff --cached --quiet; then
            echo "Audit artifacts already fresh"
            exit 0
          fi
          git commit -m "chore(cleanup): refresh database audit artifacts"
          git push origin HEAD:cleanup/deep-clean-round-1
