name: Build Demo web bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lena-demo-web-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo-web:
    name: Build deployable Demo web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build canonical Demo web bundle
        run: node scripts/vercel-demo-build.mjs

      - name: Upload deployable Demo web bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lena-demo-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
