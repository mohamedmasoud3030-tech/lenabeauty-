name: Cleanup round 2

on:
  push:
    branches:
      - cleanup/deep-clean-round-1
    paths:
      - .github/workflows/cleanup-round2.yml

permissions:
  contents: write

env:
  VITE_DATA_BACKEND: supabase
  VITE_BRANCH_MODE: single

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/deep-clean-round-1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic cleanup
        run: python scripts/cleanup-round2.py

      - run: npm ci

      - name: Regenerate canonical audit artifacts
        run: |
          node scripts/audit/replay-schema.mjs
          node scripts/audit/scan-frontend.mjs
          node scripts/audit/build-matrix.mjs

      - name: Validate full repository gates
        run: |
          npm run audit:gate
          npm run db:types:check
          npm run ci:migrations
          npm run ci:rpc-check
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm audit --audit-level=low
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(cleanup): remove remaining portal and deployment residue"
          git push origin HEAD:cleanup/deep-clean-round-1
