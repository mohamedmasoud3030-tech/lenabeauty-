<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lena Beauty</title>
  <desc id="desc">A luminous rose-gold and lilac ankh inspired beauty emblem with a feminine profile.</desc>
  <defs>
    <linearGradient id="gold" x1="92" y1="54" x2="420" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3D7"/>
      <stop offset=".2" stop-color="#E8BB78"/>
      <stop offset=".48" stop-color="#B96E35"/>
      <stop offset=".72" stop-color="#F0C98F"/>
      <stop offset="1" stop-color="#8F512B"/>
    </linearGradient>
    <linearGradient id="lilac" x1="186" y1="82" x2="326" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7DDF5"/>
      <stop offset=".48" stop-color="#B99BD7"/>
      <stop offset="1" stop-color="#7550A4"/>
    </linearGradient>
    <radialGradient id="jewel" cx="45%" cy="35%" r="65%">
      <stop stop-color="#FFFCEB"/>
      <stop offset=".36" stop-color="#F5C56D"/>
      <stop offset=".72" stop-color="#A85D30"/>
      <stop offset="1" stop-color="#6B3B2C"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="235" r="178" stroke="#C8915A" stroke-width="1.5" opacity=".2"/>
    <circle cx="256" cy="235" r="150" stroke="#A67BC8" stroke-width="1" opacity=".16" stroke-dasharray="3 9"/>
    <circle cx="256" cy="235" r="121" stroke="#D9AC73" stroke-width="1" opacity=".14"/>
    <path d="M256 54V31M256 440v34M79 256H47M433 256h32" stroke="#D39A58" stroke-width="1.5" opacity=".55"/>
    <path d="M256 35l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#D79B4D" stroke="none" opacity=".9"/>
  </g>

  <ellipse cx="256" cy="260" rx="145" ry="177" fill="#B68FD8" opacity=".08" filter="url(#soft)"/>

  <g filter="url(#glow)">
    <!-- Loop -->
    <path d="M256 61C193 61 157 108 167 164c8 46 38 79 89 105 51-26 81-59 89-105 10-56-26-103-89-103Z" fill="url(#lilac)" fill-opacity=".16" stroke="url(#gold)" stroke-width="13"/>
    <path d="M256 79c-48 0-75 36-68 79 6 35 28 62 68 85 40-23 62-50 68-85 7-43-20-79-68-79Z" stroke="#F7D7A4" stroke-width="2" opacity=".7"/>

    <!-- Horizontal arms -->
    <path d="M121 245c35 1 70-2 107-12 18-5 37-2 53 8 17-10 35-13 54-8 37 10 72 13 107 12l-22 36c-34-1-69-7-102-20-17-7-33-7-49 1-16-8-32-8-49-1-33 13-68 19-102 20Z" fill="url(#gold)" fill-opacity=".82" stroke="#8A4A2D" stroke-width="2.5"/>
    <path d="M131 253c37 0 70-4 103-13M381 253c-37 0-70-4-103-13" stroke="#FFF0D0" stroke-width="2" opacity=".72"/>
    <path d="M121 245l22 18-25 18M391 263l30-18 21 36" fill="url(#lilac)" fill-opacity=".58" stroke="#7B55A8" stroke-width="2"/>

    <!-- Stem -->
    <path d="M226 260h60l18 154-48 47-48-47Z" fill="url(#lilac)" fill-opacity=".28" stroke="url(#gold)" stroke-width="11"/>
    <path d="M240 279h32l12 126-28 28-28-28Z" stroke="#F4D5A3" stroke-width="2" opacity=".6"/>
    <path d="M256 287v132M241 389l15 22 15-22" stroke="#D7A05F" stroke-width="1.5" opacity=".75"/>

    <!-- Center jewel -->
    <circle cx="256" cy="256" r="34" fill="#2B1538" fill-opacity=".28" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="256" cy="256" r="22" fill="url(#jewel)" stroke="#FFE9B6" stroke-width="2"/>
    <circle cx="250" cy="249" r="7" fill="#FFF7D9" opacity=".88"/>
  </g>

  <!-- Beauty profile inside the loop -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M278 112c-20-18-53-10-64 12-8 17-5 36 6 49 5 6 5 12 0 18-5 7-4 14 5 17l17 5c-4 4-5 8-1 12l7 6c-1 13 6 23 17 27 13 5 27 0 34-11" stroke-width="5.5"/>
    <path d="M216 128c17-18 43-23 65-11M261 157c10-5 21-4 29 2M265 174c7 4 14 4 20 0" stroke-width="3.2" opacity=".8"/>
    <path d="M244 231c-8 13-19 23-34 29M294 247c6 12 17 21 31 27" stroke-width="4" opacity=".86"/>
  </g>
  <path d="M227 229c-12 7-22 18-28 32 14-4 27 0 39 10 3-16 0-30-11-42Zm58 18c11 6 20 15 27 28-13-3-25 1-35 10-3-15-1-28 8-38Z" fill="#B58BD3" fill-opacity=".6" stroke="#D9A765" stroke-width="2"/>

  <!-- Fine celestial details -->
  <g fill="#D59C55">
    <path d="M155 179l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".72"/>
    <path d="M363 187l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".72"/>
    <circle cx="122" cy="319" r="3" opacity=".65"/>
    <circle cx="390" cy="319" r="3" opacity=".65"/>
  </g>
</svg>
